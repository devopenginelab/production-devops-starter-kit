name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test Rust Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Formatting
        run: cargo fmt --manifest-path app/Cargo.toml -- --check

      - name: Run Clippy Linter
        run: cargo clippy --manifest-path app/Cargo.toml -- -D warnings

      - name: Build Rust Service (Release)
        run: cargo build --release --manifest-path app/Cargo.toml

  docker-verify:
    name: Verify Hardened Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          tags: status-api:test
          load: true

      - name: Run Container Health Check
        run: |
          docker run -d --name test-container -p 8080:8080 status-api:test
          sleep 3
          curl --fail http://localhost:8080/health
          docker stop test-container
